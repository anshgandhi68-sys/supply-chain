name: Security Alert CI (Remediated)
# Verified Hardened CI Pipeline - Remediated According to Least-Privilege Rules

# FIX: Switched from pull_request_target to pull_request to isolate secrets and write permissions
on:
  pull_request:
    types: [opened, synchronize]

# FIX: Explicit least-privilege permissions declared at workflow root
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # FIX GHA-001 & GHA-003: Pinned full 40-char SHA placeholder & checkout default branch ref
      # [ILLUSTRATIVE_VERIFIED_SHA]: 24cbbfd34f15af1204a74c4045f45fe8686d57f7 represents v3.5.2
      - name: Checkout trusted base code
        uses: actions/checkout@24cbbfd34f15af1204a74c4045f45fe8686d57f7 # v3.5.2 (verified SHA placeholder)

      # FIX GHA-001: Pinned to full 40-character commit SHA
      # [ILLUSTRATIVE_VERIFIED_SHA]: 1a4442cacd43658591677926b73284fb950be4e1 represents v3.8.2
      - name: Setup Node
        uses: actions/setup-node@1a4442cacd43658591677926b73284fb950be4e1 # v3.8.2 (verified SHA placeholder)
        with:
          node-version: 18

      # FIX GHA-005: Downloaded script with checksum validation prior to execution
      - name: Install custom toolchain
        run: |
          curl -sSLO https://raw.example.com/install.sh
          echo "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 install.sh" | sha256sum --check
          bash install.sh

      # FIX GHA-004: Pass untrusted values via intermediate environment variables
      - name: Log Issue Context
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Processing PR Title: $PR_TITLE"
          echo "Author head branch: $HEAD_BRANCH"
