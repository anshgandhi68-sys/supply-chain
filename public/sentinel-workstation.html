<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SENTINEL 2.0</title>
<meta name="description" content="Evidence-driven software supply-chain security investigation workstation analyzing dependency lineages, attack graphs, and safe remediations.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-display:"Space Grotesk",sans-serif;--font-body:"DM Sans",sans-serif;--ease-out:cubic-bezier(.23,1,.32,1);--ink:#11110F;--chalk:#F2F0EA;--fog:#D9DDD8;--alu:#AEB5B1;--ox:#B85E3E;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#11110F;--chalk:#F2F0EA}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;background:#F2F0EA;color:#11110F;font:400 16px var(--font-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid #11110F;outline-offset:3px}
.hero{position:relative}
.media{position:fixed;inset:0;z-index:0;pointer-events:none}
.media svg{position:absolute;inset:0;width:100%;height:100%}
.media .tint{position:absolute;inset:0;background:#D9DDD8;opacity:.22;mix-blend-mode:multiply}
.media .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 48%,transparent 36%,rgb(17 17 15/18%) 100%);opacity:.55}
.media .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgb(217 221 216/.34) 0%,rgb(217 221 216/.1) 28%,transparent 48%)}
@media(max-width:767px){.media .veil{background:linear-gradient(180deg,transparent 34%,rgb(242 240 234/.28) 62%,rgb(242 240 234/.7) 100%),linear-gradient(90deg,rgb(242 240 234/.16) 0%,transparent 46%)}.media svg{object-position:60% center}}
nav.bar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
@media(min-width:640px){nav.bar{padding:20px 32px}}@media(min-width:768px){nav.bar{padding:20px 40px}}
.lock{display:flex;gap:8px;align-items:center}
.word{font:600 20px var(--font-display);letter-spacing:-.03em;text-transform:uppercase}
.lock svg{width:24px;height:24px}
@media(min-width:768px){.word{font-size:22px}.lock svg{width:28px;height:28px}}
.center,.cta{display:none}
@media(min-width:1024px){.center,.cta{display:block}}
.center button{font:500 16px var(--font-body);letter-spacing:.01em;transition:opacity 180ms}
.center button:hover,.center button:focus-visible,.cta:hover{opacity:.55}
.cta{font:500 16px var(--font-body);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgb(17 17 15/70%);transition:opacity 180ms}
.burger{width:28px;height:28px;position:relative}
@media(min-width:1024px){.burger{display:none}}
.burger i{position:absolute;left:2px;width:24px;height:2px;background:#11110F;transform-origin:center;transition:transform 300ms ease-out,opacity 300ms ease-out}
.burger i:nth-child(1){top:6px}.burger i:nth-child(2){top:13px}.burger i:nth-child(3){top:20px}
.open .burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}.open .burger i:nth-child(2){opacity:0}.open .burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:19;background:rgb(242 240 234/82%);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 300ms ease-out;display:flex;flex-direction:column;justify-content:center;padding:0 20px}
.open .menu{opacity:1;pointer-events:auto}
.menu button{display:block;text-align:left;font:500 32px/1 var(--font-body);margin-bottom:32px}
.menu button.u{text-decoration:underline;text-underline-offset:8px}
.copy{position:relative;z-index:10;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px calc(48px + env(safe-area-inset-bottom));will-change:transform,opacity}
@media(min-width:640px){.copy{padding-left:32px;padding-right:32px}}
@media(min-width:768px){.copy{padding:0 40px 40px;justify-content:center}}
.col{max-width:34rem;margin-top:auto}@media(min-width:768px){.col{margin-top:96px}}
.blur{font-size:clamp(16px,3.5vw,23px);line-height:1.3;margin:0 0 20px;filter:blur(3.5px);user-select:none;pointer-events:none}
.tw{font-size:clamp(18px,3.8vw,25px);line-height:1.35;min-height:2.7em;margin:0 0 20px}
@media(min-width:768px){.blur,.tw{margin-bottom:24px}}
.cur{display:inline-block;width:2px;height:1.1em;background:#11110F;margin-left:2px;vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{display:none;font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.7;margin-bottom:10px}
@media(pointer:coarse){.hint{display:block}}
.pills{display:flex;flex-wrap:wrap;gap:8px;opacity:0;transform:translateY(8px);transition:opacity 400ms ease-out,transform 400ms ease-out}
.pills.on{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;font:500 13px var(--font-body);padding:.3em 16px;white-space:nowrap;background:#F2F0EA;border:1px solid rgb(17 17 15/10%);transition:color 200ms ease,background 200ms ease,border-color 200ms ease,transform 160ms var(--ease-out)}
@media(min-width:640px){.pill{font-size:14.5px;padding:.3em 18px}}
.pill:hover,.pill:focus-visible{background:#11110F;color:#F2F0EA}.pill:active{transform:scale(.97)}
.pill.o{background:transparent;border-color:#F2F0EA}.pill.o:hover,.pill.o:focus-visible{border-color:#11110F}.pill u{text-underline-offset:2px}
.status{position:fixed;left:20px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;font-size:12px;letter-spacing:.04em;pointer-events:none}
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:0 20px}
@media(min-width:640px){.ov{padding:0 32px}}
.dim{position:absolute;inset:0;background:#11110F;opacity:.35}
.pn{position:relative;background:#F2F0EA;border:1px solid #11110F;border-radius:12px;padding:24px;width:100%;max-width:28rem;max-height:min(82svh,36rem);overflow:auto;animation:din 240ms var(--ease-out)}
.pn.w{max-width:40rem}
@media(min-width:640px){.pn{padding:28px}}
@keyframes din{from{opacity:0;transform:scale(.97)}}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid rgb(17 17 15/25%);font-size:18px;line-height:1;transition:background 200ms,color 200ms}
.x:hover{background:#11110F;color:#F2F0EA}
h2{font:600 22px var(--font-display);margin:0 36px 10px 0;outline:0}
p{margin:0 0 12px;font-size:14px;line-height:1.45}.sm{font-size:12px;opacity:.7}
label{display:block;font:500 14px var(--font-body);margin-bottom:8px}
input,textarea,select{width:100%;background:#F2F0EA;color:#11110F;border:1px solid rgb(17 17 15/25%);border-radius:8px;padding:8px 12px;font:400 14px var(--font-body);margin-bottom:12px}
textarea{min-height:84px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.err{color:#B85E3E;font-size:13px;margin:0 0 10px}
.btn{background:#11110F;color:#F2F0EA;border-radius:999px;padding:.4em 16px;font:500 13px var(--font-body);margin:0 8px 8px 0;transition:transform 160ms var(--ease-out)}
.btn:active{transform:scale(.97)}@media(min-width:640px){.btn{font-size:14px}}
.btn.g{background:transparent;color:#11110F;border:1px solid #11110F}
.m{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.m div{border:1px solid rgb(17 17 15/25%);border-radius:8px;padding:8px 12px}.m b{display:block;font:600 22px var(--font-display)}.m span{font-size:12px;opacity:.7}
.row{display:block;width:100%;text-align:left;border-top:1px solid #11110F;padding:10px 0;font:500 14px var(--font-body)}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid #11110F;border-radius:999px;padding:0 8px;margin-right:6px}
.tag.ox{color:#B85E3E;border-color:#B85E3E}
pre{font:12px/1.5 ui-monospace,monospace;background:#D9DDD8;border-radius:8px;padding:10px;overflow:auto;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
h3{font:600 13px var(--font-display);color:#B85E3E;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
ul{margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.5}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% center}
@media(min-width:768px){.photo{object-position:68% center}}
.beam{position:absolute;top:0;bottom:0;left:-30%;width:160%;background:linear-gradient(112deg,transparent 38%,rgb(255 232 190/.75) 50%,transparent 62%);mix-blend-mode:overlay;will-change:transform}
.wash{position:absolute;inset:0;background:#F2F0EA;opacity:0}
#chaps{position:relative;z-index:10;padding-bottom:30vh}
.chap{min-height:92vh;display:flex;align-items:center;padding:0 20px;will-change:transform,opacity}
@media(min-width:640px){.chap{padding:0 32px}}@media(min-width:768px){.chap{padding:0 40px}}
.chap .col{margin:0;max-width:28rem}
.num{font:600 13px var(--font-display);color:#B85E3E;letter-spacing:.04em}
h2.ch{font:600 clamp(30px,5.5vw,52px)/1.02 var(--font-display);letter-spacing:-.03em;margin:6px 0 14px;text-transform:none}
.chap p{font-size:clamp(16px,2.6vw,19px);line-height:1.4}
#rail{position:fixed;right:20px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;font:500 12px var(--font-body);letter-spacing:.04em;display:flex;align-items:center;gap:10px;pointer-events:none}
#rail b{display:block;width:64px;height:1px;background:rgb(17 17 15/30%);position:relative}
#rail b i{position:absolute;left:0;top:-1px;height:3px;width:100%;background:#B85E3E;transform-origin:left;transform:scaleX(0)}
.stage{position:absolute;inset:0;perspective:1100px;perspective-origin:70% 40%;overflow:hidden}
.sun{position:absolute;inset:0;background:radial-gradient(ellipse at 96% -5%,rgb(255 224 168/.65),transparent 55%),linear-gradient(115deg,transparent 52%,rgb(255 214 150/.2) 74%,transparent 90%);mix-blend-mode:screen;opacity:.6}
.o3{position:absolute;left:0;top:0;translate:-50% -50%;transform-style:preserve-3d;will-change:transform,opacity;opacity:0;--u:clamp(110px,17vmin,190px)}
#lens{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);filter:drop-shadow(0 24px 22px rgb(17 17 15/.35))}
#orb{width:var(--u);height:var(--u);border-radius:50%;background:radial-gradient(circle at 32% 28%,rgb(255 255 255/.9),rgb(217 221 216/.35) 30%,rgb(174 181 177/.22) 60%,rgb(17 17 15/.4) 100%);box-shadow:inset -10px -14px 26px rgb(17 17 15/.3),0 30px 40px -20px rgb(17 17 15/.45)}
#orb::after{content:"";position:absolute;left:18%;bottom:12%;width:50%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgb(255 226 170/.85),transparent 70%);filter:blur(4px)}
#pan{width:calc(var(--u)*1.1);height:calc(var(--u)*1.5)}
#pan i{position:absolute;inset:0;border:1px solid rgb(242 240 234/.75);background:linear-gradient(135deg,rgb(242 240 234/.42),rgb(174 181 177/.16));backdrop-filter:blur(2px)}
#pan i:nth-child(1){transform:translateZ(-56px)}#pan i:nth-child(3){transform:translateZ(56px)}
#pan i:nth-child(3)::after{content:"";position:absolute;right:8%;bottom:6%;width:22%;height:6%;background:#B85E3E}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 500ms ease}canvas#gl.on{opacity:1}
.gl .o3{display:none}
@media(prefers-reduced-motion:reduce){.o3{display:none}}
@media(prefers-reduced-motion:reduce){#rail{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pills{opacity:1;transform:none}}
</style></head>

<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[['overview','Overview'],['analyze','Analysis'],['graph','Attack Graph'],['investigate','Investigation'],['remediation','Remediation'],['reports','Reports']];
const PILLS=[['analyze','Start new analysis'],['overview','Open overview'],['graph','Explore attack graph'],['investigate','Investigate a finding'],['remediation','Review safe patches'],['reports','Export a report']];
$('#center').innerHTML=NAV.map(n=>`<button data-open="${n[0]}">${n[1]}</button>`).join(', ');
$('#menu').innerHTML=NAV.map(n=>`<button tabindex="-1" data-open="${n[0]}">${n[1]}</button>`).join('')+'<button tabindex="-1" class="u" data-open="telemetry">Telemetry &amp; coverage</button>';
const EM='studio@sentinel.example';
$('#pills').innerHTML=PILLS.map(p=>`<button class="pill" data-open="${p[0]}">${p[1]}</button>`).join('')+`<button class="pill o" id="cp"><span id="cpl">Copy contact: <u>${EM}</u></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false"><rect x="3.4" y="3.4" width="7.1" height="7.1" stroke="currentColor"/><rect x="1.5" y="1.5" width="7.1" height="7.1" stroke="currentColor"/></svg></button>`;
/* ---------- state ---------- */
let scan={mode:null,label:'No scan yet',nodes:{},findings:[],lock:true,partial:false};
let sel=null,sevF='all';
const DEMO_F=[
{id:'DEMO-001',sev:'high',cat:'dep',pkg:'qs',v:'6.5.2',fix:'6.5.3',path:['app','express@4.17.1','qs@6.5.2'],direct:false,prod:true},
{id:'DEMO-002',sev:'high',cat:'dep',pkg:'lodash',v:'4.17.15',fix:'4.17.21',path:['app','lodash@4.17.15'],direct:true,prod:true},
{id:'DEMO-003',sev:'medium',cat:'ci',pkg:'actions/checkout',v:'v4 (tag)',fix:'40-char commit SHA',path:['.github/workflows/ci.yml'],direct:true,prod:false}];
function loadDemo(){scan={mode:'demo',label:'Controlled Risky Demo',lock:true,partial:false,findings:DEMO_F,
nodes:{express:{v:'4.17.1',direct:true,kids:['qs']},qs:{v:'6.5.2',kids:[]},lodash:{v:'4.17.15',direct:true,kids:[]}}};sel='DEMO-001'}
function jerr(t,e){let m=/line (\d+) column (\d+)/.exec(e.message);if(m)return`line ${m[1]}, column ${m[2]}`;m=/position (\d+)/.exec(e.message);if(!m)return e.message;const b=t.slice(0,+m[1]).split('\n');return`line ${b.length}, column ${b[b.length-1].length+1}`}
function runLive(pj,lk){let p,l;
try{p=JSON.parse(pj)}catch(e){return'package.json is not valid JSON at '+jerr(pj,e)+'.'}
if(!p||typeof p!=='object'||Array.isArray(p))return'package.json must be a JSON object.';
if(lk.trim()){try{l=JSON.parse(lk)}catch(e){return'package-lock.json is not valid JSON at '+jerr(lk,e)+'.'}}
const dd={...p.dependencies,...p.devDependencies},nodes={};
if(l&&l.packages){for(const[k,e]of Object.entries(l.packages)){if(!k)continue;const n=k.split('node_modules/').pop();nodes[n]={v:e.version,dev:!!e.dev,kids:Object.keys(e.dependencies||{})}}}
else if(l&&l.dependencies){const w=(d,dev)=>{for(const[n,e]of Object.entries(d)){nodes[n]={v:e.version,dev:!!e.dev,kids:Object.keys(e.requires||{})};if(e.dependencies)w(e.dependencies)}};w(l.dependencies)}
const hasLock=!!(l&&(l.packages||l.dependencies));
if(!hasLock)for(const[n,r]of Object.entries(dd))nodes[n]={v:r,kids:[],unv:true};
for(const n of Object.keys(dd))if(nodes[n])nodes[n].direct=true;
const f=[];if(!hasLock)f.push({id:'VERSION_UNVERIFIED',sev:'info',cat:'dep',pkg:Object.keys(dd).length+' declared packages',v:'ranges only',fix:'Provide package-lock.json',path:['app'],direct:true,prod:true});
scan={mode:'live',label:p.name||'Pasted manifest',nodes,findings:f,lock:hasLock,partial:!hasLock};sel=f[0]?f[0].id:null;return''}
const sc=()=>scan.findings.filter(f=>f.sev==='critical'||f.sev==='high').length;
const score=()=>Math.max(0,100-30*scan.findings.filter(f=>f.sev==='critical').length-15*scan.findings.filter(f=>f.sev==='high').length-5*scan.findings.filter(f=>f.sev==='medium').length);
const tag=()=>scan.mode==='demo'?'<span class="tag ox">Demo dataset</span>':scan.mode==='live'?'<span class="tag">Live manifest</span>':'<span class="tag">No dataset</span>';
const bar=(w=0)=>w;
function srisk(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);if(isNaN(y[0])||isNaN(x[0]))return'Unknown';return y[0]>x[0]?'High (major)':y[1]>x[1]?'Moderate (minor)':'Low (patch)'}
const cur=()=>scan.findings.find(f=>f.id===sel);
/* ---------- dialog views ---------- */
const V={
overview:()=>{const n=Object.keys(scan.nodes).length,fx=scan.findings.filter(f=>f.fix&&f.sev!=='info').length,list=scan.findings.filter(f=>sevF==='all'||f.sev===sevF);
return{t:'Investigation overview & posture.',w:1,h:`${tag()}<p class="sm">Posture = 100 − 30 per critical − 15 per high − 5 per medium (floor 0). A transparent prototype rule, not a certified score.</p>
<div class="m"><div><b>${score()} / 100</b><span>Posture score</span></div><div><b>${scan.mode?(scan.partial?'Partial':'Complete'):'Incomplete data'}</b><span>Audit verdict</span></div><div><b>${sc()}</b><span>Critical &amp; high</span></div><div><b>${scan.findings.filter(f=>f.path.length>1).length}</b><span>Plausible attack paths</span></div><div><b>${n}</b><span>Dependencies cataloged</span></div><div><b>${fx}</b><span>Candidate patches</span></div></div>
<button class="btn" data-act="demo">Analyze benchmark: Controlled Risky Demo</button><button class="btn g" data-open="analyze">Start new analysis</button>
<label for="sf">Cataloged findings (${list.length})</label><select id="sf" data-act="sev">${['all','critical','high','medium'].map(s=>`<option value="${s}"${s===sevF?' selected':''}>${s==='all'?'All severities':s[0].toUpperCase()+s.slice(1)+' only'}</option>`).join('')}</select>
${list.length?list.map(f=>`<button class="row" data-act="pick" data-id="${f.id}"><span class="tag">${f.sev}</span>${esc(f.pkg)} ${esc(f.v)} <span class="sm">· ${f.id}</span></button>`).join(''):'<p class="sm">No findings match the selected filters.</p>'}`}},
analyze:()=>({t:'Start with a manifest.',w:1,h:`<p>Paste package.json and, ideally, package-lock.json (v1, v2, v3). Parsing runs in your browser; nothing is uploaded. Advisory enrichment is not connected in this prototype.</p>
<label for="pj">package.json</label><textarea id="pj" placeholder='{"name":"app","dependencies":{"express":"^4.17.1"}}'></textarea>
<label for="lk">package-lock.json (optional)</label><textarea id="lk"></textarea><p class="err" id="e1" aria-live="polite"></p>
<button class="btn" data-act="run">Analyze manifest</button><button class="btn g" data-act="demo">Load benchmark</button>`}),
graph:()=>{const q=(window._gq||'').toLowerCase(),iso=window._iso;let r=Object.entries(scan.nodes).filter(([n])=>n.includes(q));
const att=new Set(scan.findings.flatMap(f=>f.path));if(iso)r=r.filter(([n,o])=>att.has(n+'@'+o.v));
const par=n=>Object.entries(scan.nodes).filter(([,o])=>o.kids.includes(n)).map(([k])=>k);
return{t:'Dependency attack graph.',w:1,h:`${tag()}<p class="sm">A graph path is a modeled relationship, not proof of exploitation. ${scan.partial?'Graph is partial: no lockfile.':''}</p>
<label for="gs">Search nodes</label><input id="gs" data-act="gq" value="${esc(window._gq||'')}"><button class="btn g" data-act="iso">${iso?'Show all nodes':'Isolate attack paths'}</button>
${r.length?r.map(([n,o])=>{const f=scan.findings.some(x=>x.path.includes(n+'@'+o.v));return`<div class="row" style="cursor:default">${f?'<span class="tag ox">flagged</span>':''}${esc(n)}@${esc(o.v)} <span class="sm">· ${o.direct?'direct':'transitive'} · parents: ${par(n).map(esc).join(', ')||'app'} · children: ${o.kids.length}</span></div>`}).join(''):'<p class="sm">No nodes. Run an analysis or load the benchmark.</p>'}`}},

<h3>Observed facts</h3><ul><li>${f.id==='VERSION_UNVERIFIED'?'Only declared ranges are available; no lockfile.':`Resolved version: ${esc(f.v)}`}</li><li>Source: ${scan.mode==='demo'?'controlled fixture':'pasted manifest'}</li>${f.fix?`<li>Candidate fix: ${esc(f.fix)}</li>`:''}</ul>
<h3>Inferred risks</h3><ul><li>${f.direct?'Direct':'Transitive'} dependency; ${f.prod?'production':'CI/dev'} scope.</li><li>Modeled lineage: ${f.path.map(esc).join(' → ')}</li></ul>
<h3>Unknowns and boundaries</h3><ul><li>Whether the vulnerable code runs at runtime.</li><li>Whether application input validation prevents exploitation.</li><li>Undisclosed vulnerabilities.</li></ul>

reports:()=>({t:'Export a report.',w:1,h:`${tag()}<p class="sm">Classification is preserved in the export.</p><pre id="md">${esc(md())}</pre><button class="btn" data-act="cmd">Copy Markdown</button>`}),
telemetry:()=>({t:'Telemetry & coverage.',h:`<p>This static prototype runs no live OSV, SSRF, or API health checks, so every service is shown as <b>not connected</b>, not healthy.</p><p class="sm">Ecosystem coverage matrix: not verified here.</p>`})};
function md(){const d=scan.mode==='demo'?'Controlled Demonstration Test Fixtures':scan.mode==='live'?'Live Repository Audit':'No dataset';

sun.style.opacity=.6+.3*Math.sin(t*6.28);if(glU){glU(t,pr,o);return}lens.style.opacity=o;orb.style.opacity=o;pan.style.opacity=o*.9;
lens.style.transform=`translate3d(${W*(.64+.1*Math.sin(t*7))}px,${H*(.2+.38*t)}px,${140*Math.sin(t*6)}px) rotateX(${50-t*100}deg) rotateY(${-30+t*420+pr*40}deg) rotateZ(${-20+t*60}deg)`;
orb.style.transform=`translate3d(${W*(.82-.1*Math.cos(t*8))}px,${H*(.64-.3*t)}px,${-150+260*t}px) rotateY(${t*300}deg)`;

$('#ri').textContent='0'+(k<.3?0:near)+' / 06';$('#rail i').style.transform=`scaleX(${S})`;paint()}
function initGL(){const K=THREE,cv=document.createElement('canvas');cv.id='gl';$('.media').insertBefore(cv,$('#beam'));
const r=new K.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=K.SRGBColorSpace;
const sc=new K.Scene(),cam=new K.PerspectiveCamera(35,1,.1,60);cam.position.z=10;
const es=new K.Scene();es.add(new K.Mesh(new K.BoxGeometry(30,30,30),new K.MeshBasicMaterial({color:0x4a463f,side:K.BackSide})));
const L=(w,h,x,y,z,c)=>{const m=new K.Mesh(new K.PlaneGeometry(w,h),new K.MeshBasicMaterial({color:c,side:K.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)};
L(10,6,9,8,6,new K.Color(9,7.2,5));L(14,1.2,-8,3,8,new K.Color(4,4.2,4.4));L(8,8,-10,-4,-6,new K.Color(1.4,1.3,1.2));L(20,4,0,-10,4,new K.Color(.9,.85,.8));

const tex=new K.TextureLoader().load($('#photo').src,()=>{bg.material.map=tex;bg.material.color.set(0xffffff);bg.material.needsUpdate=true;fit();cv.classList.add('on')});tex.colorSpace=K.SRGBColorSpace;
const gl=(th,rg)=>new K.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:rg||.03,thickness:th,ior:1.5,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.6,attenuationColor:new K.Color(0xdfe8e4),attenuationDistance:4});

const lens=new K.Group(),ls=new K.Mesh(new K.SphereGeometry(1,64,32),gl(.9));ls.scale.set(1,1,.2);
const hd=new K.Mesh(new K.CylinderGeometry(.085,.1,1.5,24),ink);hd.rotation.z=-3*Math.PI/4;hd.position.set(1.24,-1.24,0);

[[-.55,.1,.6],[0,-.1,-.6],[.55,.1,.6]].forEach(a=>{const p=new K.Mesh(new K.BoxGeometry(1,1.5,.06),gl(.3,.1));p.position.set(a[0],0,a[1]);p.rotation.y=a[2];pan.add(p)});
const tb=new K.Mesh(new K.BoxGeometry(.28,.08,.07),ox);tb.position.set(.62,-.6,.2);tb.rotation.y=.6;pan.add(tb);

r.render(sc,cam)}}
